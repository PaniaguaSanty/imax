server:
  port: 8083

spring:
  application:
    name: imax-reservation-service
  config:
    import: "optional:configserver:"
  datasource:
    url: ${DB_RESERVATION_URL:jdbc:postgresql://localhost:5434/reservationdb}
    username: ${DB_RESERVATION_USER:reservationuser}
    password: ${DB_RESERVATION_PASS:secretpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    non-secure-port: 8083

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic

# ===========================================
# MERCADOPAGO CONFIGURATION
# ===========================================

mercadopago:
  # Credenciales de MercadoPago
  access-token: ${MERCADOPAGO_ACCESS_TOKEN}
  public-key: ${MERCADOPAGO_PUBLIC_KEY}

  # URLs de notificación (ajustar para producción)
  notification-url: ${MERCADOPAGO_NOTIFICATION_URL:http://localhost:8083/reservation-service/api/reservations/webhook/mercadopago}

  # URLs de retorno
  success-url: ${MERCADOPAGO_SUCCESS_URL:http://localhost:8083/reservation-service/api/reservations/payment/success}
  failure-url: ${MERCADOPAGO_FAILURE_URL:http://localhost:8083/reservation-service/api/reservations/payment/failure}
  pending-url: ${MERCADOPAGO_PENDING_URL:http://localhost:8083/reservation-service/api/reservations/payment/pending}

logging:
  level:
    com.cinema.imax_reservation_service: DEBUG

reservation:
  # Tiempo de expiración de reservas en minutos
  expiration-time-minutes: 10
  # Número máximo de asientos por reserva
  max-seats-per-reservation: 10
  # Intervalo de tarea programada para cancelar reservas (ms)
  cancellation-task-interval: 60000